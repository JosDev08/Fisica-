<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#071226"/>
      <stop offset="100%" stop-color="#0b1c36"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.14"/>
      <stop offset="55%" stop-color="#0077b6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#02050d" stop-opacity="0.0"/>
    </radialGradient>
    <radialGradient id="coilGlowL" cx="12%" cy="42%" r="24%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.0"/>
    </radialGradient>
    <radialGradient id="coilGlowR" cx="88%" cy="42%" r="24%">
      <stop offset="0%" stop-color="#ffd600" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffd600" stop-opacity="0.0"/>
    </radialGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1f3d" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0.98"/>
    </linearGradient>
  </defs>

  <!-- Capa 1: Base oscura de laboratorio cibernetico -->
  <rect width="1280" height="720" fill="url(#cyberBg)"/>
  <rect width="1280" height="720" fill="url(#centerGlow)"/>
  <rect width="1280" height="720" fill="url(#coilGlowL)"/>
  <rect width="1280" height="720" fill="url(#coilGlowR)"/>

  <!-- Capa 2: Arquitectura de camara de pruebas / columnas laterales -->
  <g fill="#081429" stroke="#123052" stroke-width="2">
    <polygon points="0,0 190,0 130,110 130,585 0,650"/>
    <polygon points="1280,0 1090,0 1150,110 1150,585 1280,650"/>
    <rect x="190" y="0" width="900" height="54"/>
    <polygon points="0,650 130,585 1150,585 1280,650 1280,720 0,720" fill="url(#floorGrad)"/>
  </g>

  <!-- Paneles tecnicos / osciloscopios de pared -->
  <g opacity="0.65">
    <rect x="24" y="130" width="84" height="110" fill="#050d1c" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.45"/>
    <polyline points="32,185 44,185 50,158 58,210 66,172 74,196 82,185 100,185" fill="none" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.75"/>
    <rect x="24" y="264" width="84" height="16" fill="#0d223d"/>
    <rect x="30" y="269" width="24" height="6" fill="#ffd600" opacity="0.8"/>
    <rect x="60" y="269" width="40" height="6" fill="#00f0ff" opacity="0.5"/>

    <rect x="1172" y="130" width="84" height="110" fill="#050d1c" stroke="#ffd600" stroke-width="1.5" stroke-opacity="0.45"/>
    <polyline points="1180,185 1196,185 1204,162 1212,208 1220,168 1228,198 1236,185 1248,185" fill="none" stroke="#ffd600" stroke-width="2" stroke-opacity="0.75"/>
    <rect x="1172" y="264" width="84" height="16" fill="#0d223d"/>
    <rect x="1178" y="269" width="40" height="6" fill="#00f0ff" opacity="0.5"/>
    <rect x="1224" y="269" width="24" height="6" fill="#ffd600" opacity="0.8"/>
  </g>

  <!-- Capa 3: Trazas de circuito luminosas en paredes y techo -->
  <g fill="none" stroke-linecap="square" stroke-linejoin="miter">
    <!-- Trazas cian -->
    <g stroke="#00f0ff" stroke-width="2" opacity="0.32">
      <polyline points="130,110 290,110 330,70 520,70"/>
      <polyline points="1150,110 990,110 950,70 760,70"/>
      <polyline points="130,520 260,520 300,560 460,560"/>
      <polyline points="1150,520 1020,520 980,560 820,560"/>
      <polyline points="0,410 96,410 130,376"/>
      <polyline points="1280,410 1184,410 1150,376"/>
    </g>
    <!-- Trazas amarillo voltaje -->
    <g stroke="#ffd600" stroke-width="1.5" opacity="0.28">
      <polyline points="130,140 240,140 272,108"/>
      <polyline points="1150,140 1040,140 1008,108"/>
      <polyline points="200,585 240,625 490,625"/>
      <polyline points="1080,585 1040,625 790,625"/>
    </g>
  </g>

  <!-- Nodos de circuito luminosos -->
  <g>
    <rect x="516" y="66" width="8" height="8" fill="#00f0ff" opacity="0.65"/>
    <rect x="756" y="66" width="8" height="8" fill="#00f0ff" opacity="0.65"/>
    <rect x="456" y="556" width="8" height="8" fill="#00f0ff" opacity="0.55"/>
    <rect x="816" y="556" width="8" height="8" fill="#00f0ff" opacity="0.55"/>
    <rect x="486" y="621" width="8" height="8" fill="#ffd600" opacity="0.6"/>
    <rect x="786" y="621" width="8" height="8" fill="#ffd600" opacity="0.6"/>
  </g>

  <!-- Lineas de perspectiva en el suelo del laboratorio -->
  <g stroke="#00f0ff" stroke-width="1" opacity="0.22">
    <line x1="130" y1="585" x2="1150" y2="585"/>
    <line x1="65" y1="620" x2="1215" y2="620"/>
    <line x1="10" y1="665" x2="1270" y2="665"/>
    <line x1="280" y1="585" x2="170" y2="720"/>
    <line x1="460" y1="585" x2="400" y2="720"/>
    <line x1="640" y1="585" x2="640" y2="720"/>
    <line x1="820" y1="585" x2="880" y2="720"/>
    <line x1="1000" y1="585" x2="1110" y2="720"/>
  </g>
</svg>
