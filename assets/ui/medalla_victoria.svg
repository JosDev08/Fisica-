<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Resplandor exterior sutil -->
  <rect x="6" y="4" width="20" height="24" fill="#00f0ff" fill-opacity="0.12"/>
  <rect x="4" y="6" width="24" height="20" fill="#ffd600" fill-opacity="0.10"/>

  <!-- Cintas superiores de medalla (cian eléctrico y azul táctico) -->
  <rect x="10" y="2" width="4" height="10" fill="#0077b6"/>
  <rect x="11" y="2" width="2" height="10" fill="#00f0ff"/>
  <rect x="18" y="2" width="4" height="10" fill="#0077b6"/>
  <rect x="19" y="2" width="2" height="10" fill="#00f0ff"/>
  <rect x="14" y="2" width="4" height="9" fill="#102542"/>
  <rect x="15" y="3" width="2" height="7" fill="#ffd600"/>
  <!-- Barra metálica superior -->
  <rect x="9" y="1" width="14" height="2" fill="#ffd600"/>
  <rect x="10" y="1" width="12" height="1" fill="#fff4a3"/>

  <!-- Medallón dorado octogonal -->
  <rect x="9" y="10" width="14" height="18" fill="#0a1220"/>
  <rect x="7" y="12" width="18" height="14" fill="#0a1220"/>
  <!-- Borde dorado brillante -->
  <rect x="10" y="11" width="12" height="16" fill="#d99b00"/>
  <rect x="8" y="13" width="16" height="12" fill="#d99b00"/>
  <rect x="10" y="12" width="12" height="14" fill="#ffd600"/>
  <rect x="9" y="13" width="14" height="12" fill="#ffd600"/>
  <!-- Interior oscuro tecnológico -->
  <rect x="11" y="14" width="10" height="10" fill="#081629"/>
  <rect x="10" y="15" width="12" height="8" fill="#081629"/>
  <!-- Brillo superior del bisel -->
  <rect x="10" y="11" width="12" height="1" fill="#fff5a8"/>
  <rect x="9" y="13" width="1" height="4" fill="#fff5a8"/>

  <!-- Rayo / Estrella de victoria central -->
  <rect x="15" y="15" width="2" height="8" fill="#ffd600"/>
  <rect x="12" y="18" width="8" height="2" fill="#ffd600"/>
  <rect x="14" y="17" width="4" height="4" fill="#fff4a3"/>
  <rect x="15" y="18" width="2" height="2" fill="#00f0ff"/>

  <!-- Mini sello de check verde de archivos a salvo -->
  <rect x="20" y="21" width="7" height="7" fill="#081410"/>
  <rect x="21" y="22" width="5" height="5" fill="#1cb866"/>
  <rect x="22" y="24" width="1" height="2" fill="#ffffff"/>
  <rect x="23" y="25" width="1" height="1" fill="#ffffff"/>
  <rect x="24" y="23" width="1" height="2" fill="#ffffff"/>
  <rect x="25" y="22" width="1" height="1" fill="#ffffff"/>

  <!-- Chispas eléctricas pixel art -->
  <rect x="4" y="9" width="2" height="2" fill="#00f0ff"/>
  <rect x="26" y="8" width="2" height="2" fill="#ffd600"/>
  <rect x="5" y="23" width="2" height="1" fill="#ffd600"/>
  <rect x="27" y="16" width="1" height="2" fill="#00f0ff"/>
</svg>
