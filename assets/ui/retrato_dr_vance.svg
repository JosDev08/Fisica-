<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Fondo de monitor de radio -->
  <rect x="0" y="0" width="32" height="32" fill="#07111d"/>
  <rect x="1" y="1" width="30" height="30" fill="#0b1c2e"/>
  <!-- Líneas de escaneo sutiles -->
  <rect x="2" y="4" width="28" height="1" fill="#12304a" fill-opacity="0.6"/>
  <rect x="2" y="8" width="28" height="1" fill="#12304a" fill-opacity="0.6"/>
  <rect x="2" y="12" width="28" height="1" fill="#12304a" fill-opacity="0.6"/>
  <rect x="2" y="16" width="28" height="1" fill="#12304a" fill-opacity="0.6"/>
  <rect x="2" y="20" width="28" height="1" fill="#12304a" fill-opacity="0.6"/>
  <rect x="2" y="24" width="28" height="1" fill="#12304a" fill-opacity="0.6"/>
  <rect x="2" y="28" width="28" height="1" fill="#12304a" fill-opacity="0.6"/>

  <!-- Ondas de señal de radio en esquina superior derecha -->
  <rect x="25" y="4" width="3" height="1" fill="#3be4ff"/>
  <rect x="27" y="5" width="1" height="2" fill="#3be4ff"/>
  <rect x="23" y="6" width="2" height="1" fill="#3be4ff" fill-opacity="0.7"/>
  <rect x="24" y="7" width="1" height="1" fill="#3be4ff" fill-opacity="0.7"/>
  <!-- Indicador LED EN VIVO -->
  <rect x="4" y="4" width="2" height="2" fill="#32f588"/>
  <rect x="7" y="4" width="3" height="1" fill="#32f588" fill-opacity="0.7"/>

  <!-- Hombros y bata blanca del Dr. Vance -->
  <rect x="6" y="24" width="20" height="7" fill="#d9e6f2"/>
  <rect x="5" y="26" width="22" height="5" fill="#c4d6e8"/>
  <rect x="7" y="24" width="18" height="1" fill="#ffffff"/>
  <!-- Solapas de bata y camisa azul oscuro + corbata cian -->
  <rect x="12" y="24" width="8" height="7" fill="#1c3554"/>
  <rect x="15" y="25" width="2" height="6" fill="#2bc4e8"/>
  <rect x="11" y="25" width="2" height="5" fill="#eaf3fc"/>
  <rect x="19" y="25" width="2" height="5" fill="#eaf3fc"/>
  <!-- Credencial en la bata -->
  <rect x="21" y="27" width="3" height="3" fill="#ffd84d"/>
  <rect x="22" y="28" width="1" height="1" fill="#0d1b2a"/>

  <!-- Cuello -->
  <rect x="13" y="21" width="6" height="3" fill="#d8a27c"/>
  <rect x="13" y="21" width="6" height="1" fill="#bd8660"/>

  <!-- Cabello canoso / plateado científico -->
  <rect x="10" y="6" width="12" height="4" fill="#9fb2c7"/>
  <rect x="9" y="8" width="14" height="5" fill="#8499b0"/>
  <rect x="11" y="6" width="8" height="2" fill="#cddae8"/>
  <rect x="9" y="10" width="2" height="6" fill="#7c90a6"/>
  <rect x="21" y="10" width="2" height="6" fill="#7c90a6"/>

  <!-- Rostro -->
  <rect x="11" y="10" width="10" height="11" fill="#f0be97"/>
  <rect x="12" y="20" width="8" height="2" fill="#e0ab82"/>
  <!-- Orejas -->
  <rect x="10" y="14" width="1" height="3" fill="#e0ab82"/>
  <rect x="21" y="14" width="1" height="3" fill="#e0ab82"/>

  <!-- Gafas de laboratorio iluminadas (visor cian) -->
  <rect x="11" y="13" width="10" height="3" fill="#182436"/>
  <rect x="12" y="13" width="3" height="2" fill="#4cf0ff"/>
  <rect x="17" y="13" width="3" height="2" fill="#4cf0ff"/>
  <rect x="12" y="13" width="1" height="1" fill="#ffffff"/>
  <rect x="17" y="13" width="1" height="1" fill="#ffffff"/>

  <!-- Bigote / expresión seria profesional -->
  <rect x="13" y="18" width="6" height="1" fill="#8499b0"/>
  <rect x="14" y="19" width="4" height="1" fill="#b57a5a"/>

  <!-- Diadema y micrófono de radio -->
  <rect x="8" y="11" width="2" height="6" fill="#2a3a52"/>
  <rect x="8" y="13" width="2" height="3" fill="#ffd84d"/>
  <rect x="9" y="17" width="4" height="1" fill="#2a3a52"/>
  <rect x="12" y="18" width="2" height="2" fill="#1d2b3d"/>
  <rect x="13" y="18" width="1" height="1" fill="#32f588"/>

  <!-- Marco táctico exterior con esquinas cian -->
  <rect x="0" y="0" width="32" height="1" fill="#23486b"/>
  <rect x="0" y="31" width="32" height="1" fill="#23486b"/>
  <rect x="0" y="0" width="1" height="32" fill="#23486b"/>
  <rect x="31" y="0" width="1" height="32" fill="#23486b"/>
  <!-- Esquinas brillantes -->
  <rect x="0" y="0" width="6" height="1" fill="#3be4ff"/>
  <rect x="0" y="0" width="1" height="6" fill="#3be4ff"/>
  <rect x="26" y="0" width="6" height="1" fill="#3be4ff"/>
  <rect x="31" y="0" width="1" height="6" fill="#3be4ff"/>
  <rect x="0" y="31" width="6" height="1" fill="#3be4ff"/>
  <rect x="0" y="26" width="1" height="6" fill="#3be4ff"/>
  <rect x="26" y="31" width="6" height="1" fill="#3be4ff"/>
  <rect x="31" y="26" width="1" height="6" fill="#3be4ff"/>
</svg>
