  <circle cx="44" cy="44" r="35" fill="url(#sphereGrad)" stroke="#ffebee" stroke-width="3"/>
  <!-- Anillo conductor ecuatorial -->
  <ellipse cx="44" cy="44" rx="33" ry="12" fill="none" stroke="#ffcdd2" stroke-width="2" opacity="0.65"/>
  <!-- Brillo superior -->
  <ellipse cx="32" cy="28" rx="10" ry="6" fill="#ffffff" opacity="0.45" transform="rotate(-25 32 28)"/>
  <!-- Simbolo + central (Carga Positiva) -->
