<svg xmlns="http://www.w3.org/2000/svg" width="464" height="24" viewBox="0 0 464 24">
  <defs>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <!-- Outer metallic frame -->
  <rect x="0" y="0" width="464" height="20" rx="3" fill="url(#beamGrad)" stroke="#7dd3fc" stroke-width="2"/>
  <!-- Top high-grip conductive surface -->
  <rect x="2" y="1" width="460" height="4" fill="#bae6fd"/>
  <!-- Capacitor nodes along bridge -->
  <g stroke="#e0f2fe" stroke-width="2">
    <line x1="58" y1="5" x2="58" y2="16"/>
    <line x1="64" y1="5" x2="64" y2="16"/>
    <line x1="148" y1="5" x2="148" y2="16"/>
    <line x1="154" y1="5" x2="154" y2="16"/>
    <line x1="230" y1="5" x2="230" y2="16"/>
    <line x1="236" y1="5" x2="236" y2="16"/>
    <line x1="312" y1="5" x2="312" y2="16"/>
    <line x1="318" y1="5" x2="318" y2="16"/>
    <line x1="400" y1="5" x2="400" y2="16"/>
    <line x1="406" y1="5" x2="406" y2="16"/>
  </g>
  <!-- Center energy conduit line -->
  <line x1="8" y1="10" x2="456" y2="10" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="10,6"/>
</svg>
