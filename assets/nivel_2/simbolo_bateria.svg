<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <rect x="4" y="4" width="56" height="56" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
  <!-- Wire left -->
  <line x1="10" y1="32" x2="27" y2="32" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <!-- Long positive terminal -->
  <line x1="27" y1="14" x2="27" y2="50" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Short thick negative terminal -->
  <line x1="37" y1="22" x2="37" y2="42" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
  <!-- Wire right -->
  <line x1="37" y1="32" x2="54" y2="32" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <!-- Labels -->
  <text x="15" y="22" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="bold">+</text>
  <text x="42" y="22" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">-</text>
</svg>
