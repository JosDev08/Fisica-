  <!-- Rama 1 (arriba) -->
  <rect x="18" y="19" width="12" height="2" fill="#38e8ff"/>
  <rect x="21" y="18" width="6" height="4" fill="#3be880"/>
  <!-- Rama 2 (abajo) -->
  <rect x="18" y="27" width="12" height="2" fill="#38e8ff"/>
  <rect x="21" y="26" width="6" height="4" fill="#ff9f43"/>
  <!-- Botonera -->
  <rect x="12" y="38" width="24" height="8" fill="#0b181c"/>
  <rect x="14" y="40" width="5" height="4" fill="#ffd644"/>
  <rect x="21" y="40" width="6" height="4" fill="#38e8ff"/>
  <rect x="29" y="40" width="5" height="4" fill="#3be880"/>
  <!-- Rejilla inferior -->
  <rect x="14" y="49" width="20" height="2" fill="#0a1417"/>
  <rect x="14" y="53" width="20" height="2" fill="#0a1417"/>
</svg>
