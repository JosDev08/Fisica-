<svg xmlns="http://www.w3.org/2000/svg" width="48" height="64" viewBox="0 0 48 64" shape-rendering="crispEdges">
  <!-- Pedestal y chasis -->
  <rect x="4" y="56" width="40" height="8" fill="#162426"/>
  <rect x="6" y="58" width="36" height="4" fill="#2a484c"/>
  <rect x="8" y="8" width="32" height="48" fill="#121f24"/>
  <rect x="10" y="10" width="28" height="44" fill="#1e353d"/>
  <!-- Indicador de potencia superior -->
  <rect x="12" y="4" width="24" height="6" fill="#2a4b54"/>
  <rect x="16" y="6" width="16" height="2" fill="#ffd644"/>
  <!-- Pantalla de circuito en paralelo (R1 || R2) -->
  <rect x="12" y="14" width="24" height="20" fill="#071519"/>
  <rect x="13" y="15" width="22" height="18" fill="#0d2930"/>
