<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 12 12" shape-rendering="crispEdges">
  <!-- Marco dorado (Stamin-Up) -->
  <rect x="2" y="0" width="8" height="1" fill="#3b2604"/>
  <rect x="1" y="1" width="10" height="1" fill="#3b2604"/>
  <rect x="0" y="2" width="12" height="8" fill="#3b2604"/>
  <rect x="1" y="10" width="10" height="1" fill="#3b2604"/>
  <rect x="2" y="11" width="8" height="1" fill="#3b2604"/>

  <!-- Relleno dorado / ámbar -->
  <rect x="2" y="1" width="8" height="1" fill="#fff099"/>
  <rect x="1" y="2" width="10" height="8" fill="#e6a817"/>
  <rect x="2" y="10" width="8" height="1" fill="#b57b08"/>

  <!-- Doble flecha de velocidad blanca/celeste -->
  <rect x="2" y="4" width="2" height="1" fill="#ffffff"/>
