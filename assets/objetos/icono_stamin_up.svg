  <rect x="2" y="7" width="2" height="1" fill="#ffffff"/>

  <rect x="6" y="3" width="2" height="1" fill="#ffffff"/>
  <rect x="7" y="4" width="2" height="1" fill="#ffffff"/>
  <rect x="8" y="5" width="2" height="2" fill="#ffffff"/>
  <rect x="7" y="7" width="2" height="1" fill="#ffffff"/>
  <rect x="6" y="8" width="2" height="1" fill="#ffffff"/>
</svg>
