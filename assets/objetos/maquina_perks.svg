<svg xmlns="http://www.w3.org/2000/svg" width="64" height="80" viewBox="0 0 32 40" shape-rendering="crispEdges">
  <!-- Sombra de base -->
  <rect x="3" y="38" width="26" height="2" fill="#090c12" fill-opacity="0.7"/>

  <!-- Chasis exterior oscuro (pixel outline) -->
  <rect x="4" y="1" width="24" height="37" fill="#0d111a"/>
  <rect x="3" y="3" width="26" height="34" fill="#0d111a"/>

  <!-- Cuerpo metálico retro azul-acero -->
  <rect x="5" y="2" width="22" height="35" fill="#1c2738"/>
  <rect x="4" y="4" width="24" height="32" fill="#233147"/>
  <!-- Borde lateral brillante izquierda y sombra derecha -->
  <rect x="4" y="4" width="2" height="32" fill="#354a6b"/>
  <rect x="26" y="4" width="2" height="32" fill="#141c29"/>
  <rect x="5" y="2" width="22" height="2" fill="#3e567d"/>

  <!-- Marquesina luminosa superior (PERK-A-COLA / PERKS) -->
  <rect x="6" y="4" width="20" height="6" fill="#0c1524"/>
  <rect x="7" y="5" width="18" height="4" fill="#143a5c"/>
  <rect x="7" y="5" width="18" height="1" fill="#3be4ff"/>
  <!-- Letras pixeladas "PERK" en la marquesina -->
  <!-- P -->
  <rect x="8" y="6" width="1" height="3" fill="#ffe866"/>
  <rect x="9" y="6" width="1" height="1" fill="#ffe866"/>
  <rect x="9" y="7" width="1" height="1" fill="#ffe866"/>
  <!-- E -->
  <rect x="12" y="6" width="2" height="1" fill="#ffe866"/>
  <rect x="12" y="7" width="2" height="1" fill="#ffe866"/>
  <rect x="12" y="8" width="2" height="1" fill="#ffe866"/>
  <!-- R -->
  <rect x="16" y="6" width="1" height="3" fill="#ffe866"/>
  <rect x="17" y="6" width="1" height="1" fill="#ffe866"/>
  <rect x="17" y="8" width="1" height="1" fill="#ffe866"/>
  <!-- K -->
  <rect x="20" y="6" width="1" height="3" fill="#ffe866"/>
  <rect x="21" y="7" width="1" height="1" fill="#ffe866"/>
  <rect x="22" y="6" width="1" height="1" fill="#ffe866"/>
  <rect x="22" y="8" width="1" height="1" fill="#ffe866"/>

  <!-- Vitrina iluminada con las 3 mejoras -->
  <rect x="6" y="11" width="14" height="15" fill="#0a121f"/>
  <rect x="7" y="12" width="12" height="13" fill="#13253d"/>
  <!-- Reflejo de cristal -->
  <rect x="7" y="12" width="2" height="13" fill="#1f3e61"/>
  <rect x="8" y="13" width="1" height="4" fill="#4dbdff" fill-opacity="0.45"/>

  <!-- Estante 1: Jugger-Nog (Rojo) -->
  <rect x="7" y="16" width="12" height="1" fill="#3a4d66"/>
  <rect x="9" y="13" width="2" height="3" fill="#e63946"/>
  <rect x="9" y="12" width="2" height="1" fill="#ff9aa2"/>
  <rect x="13" y="13" width="2" height="3" fill="#e63946"/>
  <rect x="13" y="12" width="2" height="1" fill="#ff9aa2"/>

  <!-- Estante 2: Stamin-Up (Amarillo/Oro) -->
  <rect x="7" y="20" width="12" height="1" fill="#3a4d66"/>
  <rect x="9" y="17" width="2" height="3" fill="#f7c844"/>
  <rect x="9" y="16" width="2" height="1" fill="#fff3b0"/>
  <rect x="13" y="17" width="2" height="3" fill="#f7c844"/>
  <rect x="13" y="16" width="2" height="1" fill="#fff3b0"/>

  <!-- Estante 3: Double Tap (Naranja/Cian) -->
  <rect x="7" y="24" width="12" height="1" fill="#3a4d66"/>
  <rect x="9" y="21" width="2" height="3" fill="#ff7b29"/>
  <rect x="9" y="20" width="2" height="1" fill="#ffd09e"/>
  <rect x="13" y="21" width="2" height="3" fill="#ff7b29"/>
  <rect x="13" y="20" width="2" height="1" fill="#ffd09e"/>

  <!-- Panel derecho: ranura de moneda + 3 botones de colores -->
  <rect x="21" y="11" width="5" height="15" fill="#101824"/>
  <!-- Ranura de Moneda de Rayo -->
  <rect x="22" y="12" width="3" height="3" fill="#2c3e59"/>
  <rect x="23" y="13" width="1" height="2" fill="#ffe666"/>
  <!-- Botones de selección -->
  <rect x="22" y="17" width="3" height="2" fill="#e63946"/>
  <rect x="22" y="20" width="3" height="2" fill="#f7c844"/>
  <rect x="22" y="23" width="3" height="2" fill="#ff7b29"/>

  <!-- Franja neón divisoria -->
  <rect x="6" y="27" width="20" height="1" fill="#3be4ff"/>

  <!-- Compuerta inferior de entrega -->
  <rect x="7" y="29" width="18" height="6" fill="#0b101a"/>
  <rect x="8" y="30" width="16" height="4" fill="#141e2e"/>
  <rect x="9" y="31" width="14" height="1" fill="#2f4361"/>

  <!-- Patas metálicas -->
  <rect x="6" y="36" width="4" height="2" fill="#101724"/>
  <rect x="22" y="36" width="4" height="2" fill="#101724"/>
</svg>
