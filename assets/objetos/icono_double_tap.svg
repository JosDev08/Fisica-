<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 12 12" shape-rendering="crispEdges">
  <!-- Marco naranja intenso (Double Tap) -->
  <rect x="2" y="0" width="8" height="1" fill="#3d1404"/>
  <rect x="1" y="1" width="10" height="1" fill="#3d1404"/>
  <rect x="0" y="2" width="12" height="8" fill="#3d1404"/>
  <rect x="1" y="10" width="10" height="1" fill="#3d1404"/>
  <rect x="2" y="11" width="8" height="1" fill="#3d1404"/>

  <!-- Relleno naranja fuego -->
  <rect x="2" y="1" width="8" height="1" fill="#ffb066"/>
  <rect x="1" y="2" width="10" height="8" fill="#e85d1a"/>
  <rect x="2" y="10" width="8" height="1" fill="#ad3b09"/>

  <!-- Dos balas energéticas gemelas -->
  <!-- Bala 1 -->
  <rect x="3" y="3" width="2" height="1" fill="#fff7b2"/>
  <rect x="3" y="4" width="2" height="5" fill="#ffffff"/>
  <rect x="3" y="8" width="2" height="1" fill="#ffe066"/>
  <!-- Bala 2 -->
  <rect x="7" y="3" width="2" height="1" fill="#fff7b2"/>
  <rect x="7" y="4" width="2" height="5" fill="#ffffff"/>
  <rect x="7" y="8" width="2" height="1" fill="#ffe066"/>
</svg>
