<svg xmlns="http://www.w3.org/2000/svg" width="64" height="72" viewBox="0 0 32 36" shape-rendering="crispEdges">
  <!-- Sombra en el suelo -->
  <rect x="3" y="34" width="26" height="2" fill="#080c14" fill-opacity="0.72"/>

  <!-- Halo luminoso sobre la carpeta clasificada en la parte superior -->
  <rect x="7" y="1" width="18" height="10" fill="#ffe866" fill-opacity="0.18"/>
  <rect x="9" y="2" width="14" height="8" fill="#3be4ff" fill-opacity="0.22"/>
  <!-- Chispas de brillo -->
  <rect x="6" y="3" width="1" height="1" fill="#fff6a8"/>
  <rect x="25" y="2" width="1" height="1" fill="#3be4ff"/>
  <rect x="24" y="6" width="1" height="1" fill="#ffe866"/>
  <rect x="8" y="7" width="1" height="1" fill="#3be4ff"/>

  <!-- Carpeta / Expediente clasificado luminoso sobre el estante -->
  <rect x="9" y="5" width="14" height="6" fill="#0d111a"/>
  <!-- Pestaña de la carpeta -->
  <rect x="10" y="4" width="5" height="2" fill="#d99a1e"/>
  <rect x="10" y="4" width="5" height="1" fill="#ffe66d"/>
  <!-- Cuerpo de carpeta dorada -->
  <rect x="10" y="6" width="12" height="4" fill="#f2b82e"/>
  <rect x="10" y="6" width="12" height="1" fill="#fff099"/>
  <!-- Hoja iluminada sobresaliendo -->
  <rect x="12" y="5" width="9" height="3" fill="#e8fbff"/>
  <rect x="13" y="6" width="5" height="1" fill="#3be4ff"/>
  <!-- Sello rojo clasificado en la carpeta -->
  <rect x="18" y="7" width="3" height="2" fill="#e63946"/>
  <rect x="19" y="7" width="1" height="1" fill="#ff9aa2"/>

  <!-- Chasis metálico del archivador / estante de laboratorio -->
  <rect x="4" y="10" width="24" height="24" fill="#0c111a"/>
  <rect x="5" y="11" width="22" height="22" fill="#2a394f"/>
  <!-- Brillo superior y bisel metálico -->
  <rect x="5" y="11" width="22" height="2" fill="#526a8c"/>
  <rect x="5" y="11" width="2" height="22" fill="#3d5270"/>
  <rect x="25" y="11" width="2" height="22" fill="#192333"/>

  <!-- Compartimento superior con archivos archivados -->
  <rect x="7" y="14" width="18" height="6" fill="#111926"/>
  <!-- Carpetas verticales en el estante -->
  <rect x="8" y="15" width="2" height="5" fill="#3c6e9c"/>
  <rect x="11" y="15" width="2" height="5" fill="#4f8bc2"/>
  <rect x="14" y="16" width="2" height="4" fill="#d4a02c"/>
  <rect x="17" y="15" width="2" height="5" fill="#3c6e9c"/>
  <rect x="20" y="15" width="2" height="5" fill="#c94652"/>
  <!-- LED indicador amarillo/alerta de archivo pendiente -->
  <rect x="23" y="15" width="1" height="2" fill="#ffd84d"/>

  <!-- Separador metálico -->
  <rect x="6" y="20" width="20" height="1" fill="#4b6282"/>

  <!-- Cajón inferior 1 -->
  <rect x="7" y="22" width="18" height="5" fill="#1f2c3f"/>
  <rect x="7" y="22" width="18" height="1" fill="#3e5373"/>
  <!-- Etiqueta y tirador -->
  <rect x="13" y="23" width="6" height="1" fill="#88a6cc"/>
  <rect x="14" y="25" width="4" height="1" fill="#3be4ff"/>

  <!-- Cajón inferior 2 -->
  <rect x="7" y="28" width="18" height="4" fill="#1c2738"/>
  <rect x="7" y="28" width="18" height="1" fill="#364966"/>
  <rect x="13" y="29" width="6" height="1" fill="#7793b8"/>
  <rect x="14" y="31" width="4" height="1" fill="#88a6cc"/>

  <!-- Patas metálicas -->
  <rect x="6" y="33" width="3" height="2" fill="#121926"/>
  <rect x="23" y="33" width="3" height="2" fill="#121926"/>
</svg>
