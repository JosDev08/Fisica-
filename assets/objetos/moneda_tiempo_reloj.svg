<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Contorno oscuro de moneda circular -->
  <rect x="5" y="1" width="6" height="1" fill="#182234"/>
  <rect x="3" y="2" width="2" height="1" fill="#182234"/>
  <rect x="11" y="2" width="2" height="1" fill="#182234"/>
  <rect x="2" y="3" width="1" height="2" fill="#182234"/>
  <rect x="13" y="3" width="1" height="2" fill="#182234"/>
  <rect x="1" y="5" width="1" height="6" fill="#182234"/>
  <rect x="14" y="5" width="1" height="6" fill="#182234"/>
  <rect x="2" y="11" width="1" height="2" fill="#182234"/>
  <rect x="13" y="11" width="1" height="2" fill="#182234"/>
  <rect x="3" y="13" width="2" height="1" fill="#182234"/>
  <rect x="11" y="13" width="2" height="1" fill="#182234"/>
  <rect x="5" y="14" width="6" height="1" fill="#182234"/>

  <!-- Aro exterior dorado brillante -->
  <rect x="5" y="2" width="6" height="12" fill="#f5b82e"/>
  <rect x="3" y="3" width="10" height="10" fill="#e69d1e"/>
  <rect x="2" y="5" width="12" height="6" fill="#e69d1e"/>
  <!-- Destellos dorados -->
  <rect x="5" y="2" width="6" height="1" fill="#fff099"/>
  <rect x="3" y="3" width="2" height="1" fill="#fff099"/>
  <rect x="2" y="5" width="1" height="2" fill="#fff099"/>
  <rect x="5" y="13" width="6" height="1" fill="#a8680c"/>
  <rect x="13" y="9" width="1" height="2" fill="#a8680c"/>

  <!-- Núcleo azul/cian cristalino -->
  <rect x="5" y="3" width="6" height="10" fill="#0b3e5c"/>
  <rect x="4" y="4" width="8" height="8" fill="#0b3e5c"/>
  <rect x="3" y="5" width="10" height="6" fill="#0b3e5c"/>
  <rect x="5" y="4" width="6" height="8" fill="#17b8e8"/>
  <rect x="4" y="5" width="8" height="6" fill="#17b8e8"/>
  <rect x="4" y="5" width="3" height="2" fill="#78f4ff"/>

  <!-- Reloj de arena dorado/blanco en el centro -->
  <!-- Tapas superior e inferior -->
  <rect x="5" y="4" width="6" height="1" fill="#ffe066"/>
  <rect x="5" y="11" width="6" height="1" fill="#ffe066"/>
  <!-- Ampolla superior -->
  <rect x="6" y="5" width="4" height="1" fill="#ffffff"/>
  <rect x="6" y="6" width="4" height="1" fill="#ffd447"/>
  <rect x="7" y="7" width="2" height="1" fill="#ffe885"/>
  <!-- Cuello y chorro de arena -->
  <rect x="7" y="8" width="2" height="1" fill="#ffffff"/>
  <!-- Ampolla inferior con arena dorada -->
  <rect x="6" y="9" width="4" height="1" fill="#a6f7ff"/>
  <rect x="7" y="9" width="2" height="1" fill="#ffd447"/>
  <rect x="6" y="10" width="4" height="1" fill="#ffbe2e"/>
</svg>
